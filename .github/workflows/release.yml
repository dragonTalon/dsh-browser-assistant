name: Release plugins

on:
  push:
    tags:
      - 'bridge-dsh@*'
      - 'bridge-browser@*'

permissions:
  contents: write

jobs:
  bridge-dsh:
    if: startsWith(github.ref_name, 'bridge-dsh@')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*@}"
          declared="$(node -p "require('./packages/bridge-dsh/package.json').version")"
          if [ "$version" != "$declared" ]; then
            echo "error: tag version ${version} != package.json version ${declared}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # bridge-dsh's own tsc needs the dsh host framework's types
      # (@deepseek-ai/*), which live in a local dsh installation
      # (scripts/link-dsh-types.sh) and are not available on CI. The offline
      # checks below bundle the REAL bridge-dsh sources, so its logic is still
      # exercised; protocol + extension typecheck fully.
      - name: Verify (typecheck + offline checks)
        run: |
          pnpm -C packages/protocol typecheck
          pnpm -C packages/extension typecheck
          node scripts/run-tests.mjs

      - name: Build
        run: bash packages/bridge-dsh/build.sh

      - name: Publish to npm
        working-directory: packages/bridge-dsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*@}"
          pkg=packages/bridge-dsh
          mkdir -p release/package
          cp "$pkg/package.json" release/package/package.json
          cp "$pkg/cordis.patch.yml" release/package/cordis.patch.yml
          cp "$pkg/CHANGELOG.md" release/package/CHANGELOG.md
          cp -R "$pkg/lib" release/package/lib
          cp -R "$pkg/src" release/package/src
          tar -czf "release/bridge-dsh-${version}.tgz" -C release package
          rm -rf release/package

      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*@}"
          mkdir -p release
          # Bilingual body from the package changelog + a generated footer that
          # pins this exact version (pnpm 11's 24h minimumReleaseAge would
          # otherwise let `@latest` silently resolve to the previous release).
          bash scripts/release-notes.sh bridge-dsh "$version" > release/notes.md
          echo "release body: $(wc -l < release/notes.md) lines"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag##*@}"
          artifact="release/bridge-dsh-${version}.tgz"
          gh release create "$tag" "$artifact" --title "bridge-dsh v${version}" --notes-file release/notes.md

  bridge-browser:
    if: startsWith(github.ref_name, 'bridge-browser@')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*@}"
          pkg_version="$(node -p "require('./packages/extension/package.json').version")"
          manifest_version="$(node -p "require('./packages/extension/manifest.json').version")"
          if [ "$version" != "$pkg_version" ]; then
            echo "error: tag version ${version} != package.json version ${pkg_version}" >&2
            exit 1
          fi
          if [ "$version" != "$manifest_version" ]; then
            echo "error: tag version ${version} != manifest.json version ${manifest_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify (typecheck + offline checks)
        run: |
          pnpm -C packages/protocol typecheck
          pnpm -C packages/extension typecheck
          node scripts/run-tests.mjs

      - name: Build
        run: bash packages/extension/build.sh

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*@}"
          mkdir -p release
          (cd packages/extension/dist && zip -q -r -X "../../../release/bridge-browser-${version}.zip" .)

      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*@}"
          mkdir -p release
          # Bilingual body from the extension changelog + generated load
          # instructions for this exact version.
          bash scripts/release-notes.sh bridge-browser "$version" > release/notes.md
          echo "release body: $(wc -l < release/notes.md) lines"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag##*@}"
          artifact="release/bridge-browser-${version}.zip"
          gh release create "$tag" "$artifact" --title "bridge-browser v${version}" --notes-file release/notes.md
