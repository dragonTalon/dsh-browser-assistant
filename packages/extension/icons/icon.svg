<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="bridge-browser 图标">
  <!--
    bridge-browser 品牌图形 · 矢量母版
    橙色圆形人物 + 单片眼镜。

    坐标与配色取自位图母版 ~/Desktop/outputs/monocle-logo.png(1024×1024),
    按 128/630 的比例映射到本 viewBox(源内容外接框 630×628)。
    实测主色:面部 #f7b735、墨色 #22292d、镜片 #c5e6f8。

    造型要点:瞳孔是"墨色圆盘 + 右上角被咬出浅色月牙缺口",
    缺口由叠在瞳孔右上缘、大部分位于瞳孔之外的浅色圆形成;
    左眼与镜片同构,镜片的缺口为镜片色、左眼的缺口为面部色。

    本文件是同步维护的矢量版本,不参与 build.sh 构建(构建只拷贝
    icon16/32/48/128 四个 PNG)。修改品牌图形时须与位图同步更新,
    并与 icon128.png 保持"同一图形"的视觉一致(见 openspec 变更 replace-extension-logo)。
  -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d6edfb"/>
      <stop offset="0.55" stop-color="#c5e6f8"/>
      <stop offset="1" stop-color="#a9d8f2"/>
    </linearGradient>
  </defs>

  <!-- 面部 -->
  <circle cx="64" cy="64" r="57" fill="#f7b735" stroke="#22292d" stroke-width="3.6"/>

  <!-- 眉毛 -->
  <path d="M27.5,40.5 C33.5,33.5 44.5,29.5 52,31.5" fill="none" stroke="#22292d"
        stroke-width="4.5" stroke-linecap="round"/>
  <path d="M76,31.5 C83.5,29.5 94.5,33.5 100.5,40.5" fill="none" stroke="#22292d"
        stroke-width="4.5" stroke-linecap="round"/>

  <!-- 左眼:外环(r≈14.7,线宽≈4.3) / 虹膜 / 瞳孔(r≈7.8) / 月牙缺口 -->
  <circle cx="41.2" cy="63.6" r="12.55" fill="none" stroke="#22292d" stroke-width="4.3"/>
  <circle cx="41.2" cy="63.6" r="7.8" fill="#22292d"/>
  <circle cx="45.4" cy="58.8" r="3.5" fill="#f7b735"/>

  <!-- 单片眼镜:镜框(r≈23.2,线宽≈4.5) / 镜片 / 瞳孔(r≈13.6) / 月牙缺口 -->
  <circle cx="88.9" cy="58.6" r="20.95" fill="none" stroke="#22292d" stroke-width="4.5"/>
  <circle cx="88.9" cy="58.6" r="18.7" fill="url(#lens)"/>
  <circle cx="88.9" cy="58.6" r="11.2" fill="#22292d"/>
  <circle cx="95.3" cy="52.6" r="5" fill="#c5e6f8"/>

  <!-- 镜柄:自镜框右下缘伸出,越出脸部轮廓 -->
  <path d="M105.6,72.9 C110,79 111,85 111,91 C111,97 107.5,103 102,109"
        fill="none" stroke="#22292d" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 嘴 -->
  <path d="M59.5,93.5 Q66,89.5 72.5,92.5 Q68.5,96.2 61.5,96" fill="none"
        stroke="#22292d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
