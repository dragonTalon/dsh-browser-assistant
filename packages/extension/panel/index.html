<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-bs · dsh 浏览器副手</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
      font-size: 14px;
    }
    #status { padding: 6px 12px; border-bottom: 1px solid rgba(128,128,128,.25); font-size: 12px; flex: none; }
    #status .row { display: flex; gap: 8px; align-items: center; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; flex: none; }
    #status.connected .dot { background: #2ecc71; }
    #status.connecting .dot, #status.reconnecting .dot { background: #f1c40f; }
    #status.stopped .dot { background: #e74c3c; }
    #statusText { font-weight: 600; }
    #statusUrl { color: #888; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    #logToggle { flex: none; font-size: 11px; padding: 2px 8px; }
    #logPanel { display: none; max-height: 35vh; overflow-y: auto; border-bottom: 1px solid rgba(128,128,128,.25); background: rgba(0,0,0,.04); font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 6px 10px; flex: none; }
    #logPanel.open { display: block; }
    .logline { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
    .logline .t { color: #888; margin-right: 6px; }
    .logline.info { color: inherit; }
    .logline.warn { color: #b9770e; }
    .logline.error { color: #c0392b; }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .row { max-width: 90%; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    .row.user { align-self: flex-end; background: rgba(52,152,219,.18); }
    .row.assistant { align-self: flex-start; background: rgba(128,128,128,.12); }
    .row.system { align-self: center; color: #888; font-size: 12px; background: none; }
    .row.working { display: flex; align-items: center; gap: 8px; color: #2e86de; font-weight: 600; font-size: 13px; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(46,134,222,.25); border-top-color: #2e86de; border-radius: 50%; animation: dsh-spin 0.8s linear infinite; flex: none; }
    @keyframes dsh-spin { to { transform: rotate(360deg); } }
    #approval { display: none; padding: 12px; border-top: 1px solid rgba(128,128,128,.25); background: rgba(241,196,15,.15); flex: none; }
    #approval .q { margin-bottom: 8px; }
    #approval .btns { display: flex; gap: 8px; }
    #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid rgba(128,128,128,.25); flex: none; }
    #composer textarea { flex: 1; resize: none; min-height: 36px; padding: 8px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); background: transparent; font: inherit; }
    button { padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); background: transparent; cursor: pointer; }
    button.primary { background: #2e86de; color: #fff; border-color: #2e86de; }
    button.danger { background: #e74c3c; color: #fff; border-color: #e74c3c; }
    #question { display: none; padding: 12px; border-top: 1px solid rgba(128,128,128,.25); background: rgba(46,134,222,.08); flex: none; max-height: 40vh; overflow-y: auto; }
    #question .q { margin-bottom: 8px; font-weight: 600; }
    .qitem { margin-bottom: 12px; }
    .qitem .qtext { font-weight: 600; margin-bottom: 2px; }
    .qitem .qdetail { color: #888; font-size: 12px; margin-bottom: 6px; }
    .qitem .qoptions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .qoption { font-size: 12px; padding: 4px 10px; }
    .qoption.selected { background: #2e86de; color: #fff; border-color: #2e86de; }
    .qitem .qcustom { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); background: transparent; font: inherit; }
  </style>
</head>
<body>
  <div id="status" class="stopped">
    <div class="row">
      <span class="dot"></span>
      <span id="statusText">stopped</span>
      <span id="statusUrl"></span>
      <button id="logToggle" class="log">日志</button>
    </div>
    <div class="row" id="pageRow">
      <span style="color:#888;">当前页</span>
      <span id="pageUrl" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">—</span>
    </div>
  </div>
  <div id="logPanel"></div>
  <div id="log"></div>
  <div id="approval">
    <div class="q" id="approvalText"></div>
    <div class="btns">
      <button class="primary" id="approveBtn">允许一次</button>
      <button class="danger" id="denyBtn">拒绝</button>
    </div>
  </div>
  <div id="question">
    <div class="q" id="questionTitle">dsh 想问你：</div>
    <div id="questionBody"></div>
    <div class="btns">
      <button class="primary" id="questionSubmitBtn">回答</button>
      <button class="danger" id="questionDismissBtn">取消</button>
    </div>
  </div>
  <div id="composer">
    <textarea id="input" placeholder="输入任务，例如：读取当前页面并总结"></textarea>
    <button class="primary" id="sendBtn">发送</button>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
