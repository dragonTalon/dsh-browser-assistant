<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dsh-bs · dsh 浏览器副手</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
      font-size: 13px; line-height: 1.5;
    }

    /* ---- 状态区 ---- */
    #status { padding: 8px 12px; border-bottom: 1px solid rgba(128,128,128,.2); font-size: 12px; flex: none; display: flex; flex-direction: column; gap: 6px; }
    #status .row { display: flex; gap: 8px; align-items: center; min-height: 20px; }
    #status .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; flex: none; }
    #status.connected .dot { background: #2ecc71; }
    #status.connecting .dot, #status.reconnecting .dot { background: #f1c40f; }
    #status.stopped .dot { background: #e74c3c; }
    #statusIcon { border-radius: 4px; flex: none; }
    #statusText { font-weight: 600; }
    #statusUrl { color: #888; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    #logToggle { flex: none; font-size: 11px; padding: 2px 8px; }
    #pageRow { font-size: 11px; }
    #pageRow .label { color: #8a8a8a; flex: none; width: 44px; }
    #pageUrl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; color: #666; }
    @media (prefers-color-scheme: dark) { #pageUrl { color: #999; } }

    /* 模型选择器（输入区内丸状控件，与 dsh GUI 的位置/观感对齐） */
    #modelWrap { flex: 0 1 auto; display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 260px; }
    #modelSelect {
      min-width: 0; max-width: 100%; font: inherit; font-size: 11px;
      padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(128,128,128,.35);
      background: transparent; color: inherit; cursor: pointer;
    }
    #modelWrap:hover #modelSelect:not(:disabled) { border-color: rgba(128,128,128,.65); }
    #modelSelect:disabled { opacity: .55; cursor: default; max-width: 130px; }
    #modelSelect optgroup, #modelSelect option { color: #111; background: #fff; font-size: 13px; }
    @media (prefers-color-scheme: dark) { #modelSelect optgroup, #modelSelect option { color: #eee; background: #262626; } }
    .capBadge {
      flex: none; font-size: 10px; padding: 1px 7px; border-radius: 999px;
      border: 1px solid transparent; white-space: nowrap;
    }
    .capBadge.vision { color: #0b7a3e; border-color: rgba(46,204,113,.5); background: rgba(46,204,113,.12); }
    .capBadge.text { color: #666; border-color: rgba(128,128,128,.4); background: rgba(128,128,128,.1); }
    .capBadge.unknown { color: #8a6d00; border-color: rgba(241,196,15,.45); background: rgba(241,196,15,.1); }
    .capBadge.none { display: none; }
    @media (prefers-color-scheme: dark) {
      .capBadge.vision { color: #7ce0a6; }
      .capBadge.text { color: #aaa; }
      .capBadge.unknown { color: #e2c04a; }
    }

    /* ---- 日志 ---- */
    #logPanel { display: none; max-height: 35vh; overflow-y: auto; border-bottom: 1px solid rgba(128,128,128,.2); background: rgba(0,0,0,.04); font-family: ui-monospace, Menlo, monospace; font-size: 11px; padding: 6px 12px; flex: none; }
    #logPanel.open { display: block; }
    .logline { padding: 1px 0; white-space: pre-wrap; word-break: break-all; }
    .logline .t { color: #888; margin-right: 6px; }
    .logline.warn { color: #b9770e; }
    .logline.error { color: #c0392b; }

    /* ---- 对话 ---- */
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
    .row { max-width: 92%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
    .row.user { align-self: flex-end; background: rgba(52,152,219,.16); border-bottom-right-radius: 4px; }
    .row.assistant { align-self: flex-start; background: rgba(128,128,128,.12); border-bottom-left-radius: 4px; }
    /* assistant 回复是 Markdown 渲染后的富文本：覆盖 pre-wrap，按正常块级排版 */
    .row.assistant { white-space: normal; }
    .row.assistant p { margin: 0 0 8px; }
    .row.assistant p:last-child { margin-bottom: 0; }
    .row.assistant h1, .row.assistant h2, .row.assistant h3,
    .row.assistant h4, .row.assistant h5, .row.assistant h6 { margin: 12px 0 6px; line-height: 1.3; }
    .row.assistant h1 { font-size: 1.5em; } .row.assistant h2 { font-size: 1.3em; }
    .row.assistant h3 { font-size: 1.15em; } .row.assistant h4 { font-size: 1.05em; }
    .row.assistant h5, .row.assistant h6 { font-size: 1em; }
    .row.assistant ul, .row.assistant ol { margin: 0 0 8px; padding-left: 22px; }
    .row.assistant li { margin: 2px 0; }
    .row.assistant blockquote { margin: 0 0 8px; padding: 2px 10px; border-left: 3px solid rgba(128,128,128,.5); color: #777; }
    .row.assistant pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.06); overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    .row.assistant code { font-family: ui-monospace, Menlo, monospace; font-size: 0.92em; background: rgba(0,0,0,.08); padding: 1px 4px; border-radius: 4px; }
    .row.assistant pre code { background: none; padding: 0; }
    .row.assistant a { color: #2e86de; }
    .row.assistant table { border-collapse: collapse; margin: 0 0 8px; }
    .row.assistant th, .row.assistant td { border: 1px solid rgba(128,128,128,.35); padding: 4px 8px; }
    .row.assistant hr { border: none; border-top: 1px solid rgba(128,128,128,.35); margin: 10px 0; }
    @media (prefers-color-scheme: dark) {
      .row.assistant blockquote { color: #999; }
      .row.assistant code { background: rgba(255,255,255,.1); }
      .row.assistant pre { background: rgba(255,255,255,.06); }
    }
    .row.system { align-self: center; color: #888; font-size: 11px; background: none; padding: 2px 8px; }
    .row.working { display: flex; align-items: center; gap: 8px; color: #2e86de; font-weight: 600; font-size: 12px; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(46,134,222,.25); border-top-color: #2e86de; border-radius: 50%; animation: dsh-spin 0.8s linear infinite; flex: none; }
    @keyframes dsh-spin { to { transform: rotate(360deg); } }

    /* ---- 底部区块（审批/提问/输入） ---- */
    .panelBlock { display: none; padding: 12px; border-top: 1px solid rgba(128,128,128,.2); flex: none; max-height: 45vh; overflow-y: auto; }
    .panelBlock .q { font-weight: 600; margin-bottom: 8px; }
    #approval { background: rgba(241,196,15,.12); }
    #question { background: rgba(46,134,222,.07); }
    .btns { display: flex; gap: 8px; margin-top: 2px; }

    /* ---- 框选附件（截图作为输入区附件，意图走主输入框） ---- */
    #attachment { display: none; gap: 8px; align-items: flex-start; padding: 6px 8px; border: 1px solid rgba(46,134,222,.35); border-radius: 8px; background: rgba(46,134,222,.06); }
    #attachment.show { display: flex; }
    #attachmentImg { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(128,128,128,.3); flex: none; background: #fff; }
    #attachmentMeta { flex: 1; min-width: 0; font-size: 11px; color: #8a8a8a; }
    #attachmentTitle { font-weight: 600; font-size: 12px; color: inherit; margin-bottom: 2px; }
    #attachmentDetails summary { cursor: pointer; color: #8a8a8a; }
    #attachmentElements { margin: 4px 0 0; padding: 6px; border-radius: 6px; background: rgba(0,0,0,.04); font-family: ui-monospace, Menlo, monospace; font-size: 10px; white-space: pre-wrap; word-break: break-all; max-height: 14vh; overflow-y: auto; }
    #attachmentRemove { flex: none; padding: 2px 8px; border-radius: 6px; font-size: 13px; line-height: 1; }

    #question { max-height: 40vh; }
    .qitem { margin-bottom: 12px; }
    .qitem .qtext { font-weight: 600; margin-bottom: 2px; }
    .qitem .qdetail { color: #888; font-size: 12px; margin-bottom: 6px; }
    .qitem .qoptions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .qoption { font-size: 12px; padding: 4px 10px; }
    .qoption.selected { background: #2e86de; color: #fff; border-color: #2e86de; }
    .qitem .qcustom { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); background: transparent; font: inherit; color: inherit; }

    /* ---- 输入区（上下两层：上层控制条，下层全宽输入 + 发送） ---- */
    #composer { display: flex; flex-direction: column; gap: 8px; padding: 8px 12px 10px; border-top: 1px solid rgba(128,128,128,.2); flex: none; }
    #composerBar { display: flex; gap: 8px; align-items: center; }
    #composerRow { display: flex; gap: 8px; align-items: flex-end; }
    #composer textarea { flex: 1; resize: none; min-height: 40px; max-height: 30vh; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; font: inherit; color: inherit; }
    button { padding: 6px 14px; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; cursor: pointer; font-size: 12px; }
    button:hover { border-color: rgba(128,128,128,.7); }
    button.primary { background: #2e86de; color: #fff; border-color: #2e86de; }
    button.primary:hover { background: #2574c2; }
    button.primary:disabled, button:disabled { opacity: .5; cursor: default; }
    button.danger { background: #e74c3c; color: #fff; border-color: #e74c3c; }
    button.danger:hover { background: #cf3f31; }
    #regionBtn { flex: none; font-size: 15px; padding: 6px 10px; }

    /* ---- 系统配置（状态栏入口 → 模态浮层） ---- */
    #settingsToggle { flex: none; display: flex; align-items: center; justify-content: center; padding: 3px 7px; }
    #settingsOverlay {
      display: none; position: fixed; inset: 0; z-index: 20;
      background: rgba(0,0,0,.45); align-items: flex-start; justify-content: center;
      padding: 24px 12px;
    }
    #settingsOverlay.open { display: flex; }
    #settingsDialog {
      width: 100%; max-width: 420px; max-height: 100%; overflow-y: auto;
      background: #fff; color: #111; border-radius: 10px;
      border: 1px solid rgba(128,128,128,.35); box-shadow: 0 12px 32px rgba(0,0,0,.35);
      padding: 14px;
    }
    @media (prefers-color-scheme: dark) { #settingsDialog { background: #262626; color: #eee; } }
    #settingsDialog h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
    #settingsDialog .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    #settingsDialog .field > label { font-size: 12px; color: #8a8a8a; }
    #settingsDialog input[type=text], #settingsDialog input[type=password] {
      width: 100%; padding: 6px 8px; border-radius: 6px; font: inherit; font-size: 12px;
      border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit;
    }
    #settingsEffective { font-size: 11px; color: #8a8a8a; word-break: break-all; }
    #settingsEffective.invalid { color: #c0392b; }
    #settingsEffective.warn { color: #b9770e; }
    #settingsHint { font-size: 11px; color: #8a8a8a; line-height: 1.4; }
    #settingsHint code { font-family: ui-monospace, Menlo, monospace; background: rgba(128,128,128,.15); padding: 0 3px; border-radius: 3px; }
    #settingsResult { display: none; font-size: 11px; line-height: 1.5; padding: 7px 9px; border-radius: 6px; margin-bottom: 10px; word-break: break-word; }
    #settingsResult.show { display: block; }
    #settingsResult.pending { background: rgba(46,134,222,.1); color: #2e86de; }
    #settingsResult.ok { background: rgba(46,204,113,.14); color: #0b7a3e; }
    #settingsResult.error { background: rgba(231,76,60,.12); color: #c0392b; }
    @media (prefers-color-scheme: dark) {
      #settingsResult.ok { color: #7ce0a6; }
      #settingsResult.error { color: #ff8b7d; }
    }
    #settingsActions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #settingsActions .spacer { flex: 1; }
  </style>
</head>
<body>
  <div id="status" class="stopped">
    <div class="row">
      <img id="statusIcon" src="../icons/icon32.png" width="16" height="16" alt="">
      <span class="dot"></span>
      <span id="statusText">stopped</span>
      <span id="statusUrl"></span>
      <button id="logToggle" class="log">日志</button>
      <button id="settingsToggle" title="系统配置：dsh 地址与 token" aria-label="系统配置">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
    <div class="row" id="pageRow">
      <span class="label">当前页</span>
      <span id="pageUrl">—</span>
    </div>
  </div>
  <div id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div id="settingsDialog">
      <h2 id="settingsTitle">系统配置</h2>
      <div class="field">
        <label for="settingsHost">dsh host</label>
        <input id="settingsHost" type="text" spellcheck="false" autocomplete="off"
               placeholder="10.0.0.7:3080 或 wss://dsh.example.com（留空＝自动发现本机 dsh）">
        <div id="settingsEffective">留空：自动发现本机 dsh</div>
      </div>
      <div class="field">
        <label for="settingsToken">token</label>
        <input id="settingsToken" type="password" spellcheck="false" autocomplete="off" placeholder="连接本机 dsh 时留空即可">
        <div id="settingsHint">
          远端 dsh 必须填 token。本机可执行 <code>cat ~/.dsh/ext-bridge-token</code> 获取（粘贴时的换行会自动忽略）。
        </div>
      </div>
      <div id="settingsResult"></div>
      <div id="settingsActions">
        <button id="settingsTest">测试连接</button>
        <button id="settingsSave" class="primary">保存并重连</button>
        <button id="settingsReset">恢复本机自动发现</button>
        <span class="spacer"></span>
        <button id="settingsClose">关闭</button>
      </div>
    </div>
  </div>
  <div id="logPanel"></div>
  <div id="log"></div>
  <div id="approval" class="panelBlock">
    <div class="q" id="approvalText"></div>
    <div class="btns">
      <button class="primary" id="approveBtn">允许一次</button>
      <button class="danger" id="denyBtn">拒绝</button>
    </div>
  </div>
  <div id="question" class="panelBlock">
    <div class="q" id="questionTitle">dsh 想问你：</div>
    <div id="questionBody"></div>
    <div class="btns">
      <button class="primary" id="questionSubmitBtn">回答</button>
      <button class="danger" id="questionDismissBtn">取消</button>
    </div>
  </div>
  <div id="composer">
    <div id="attachment">
      <img id="attachmentImg" alt="选区截图" />
      <div id="attachmentMeta">
        <div id="attachmentTitle">框选区域截图</div>
        <details id="attachmentDetails">
          <summary>选区内元素清单</summary>
          <pre id="attachmentElements"></pre>
        </details>
      </div>
      <button id="attachmentRemove" title="移除选区">×</button>
    </div>
    <div id="composerBar">
      <button id="regionBtn" title="框选页面区域截图">⌖</button>
      <div id="modelWrap">
        <select id="modelSelect" disabled title="选择会话模型；选择会成为 dsh 默认模型"></select>
        <span id="modelCap" class="capBadge none"></span>
      </div>
    </div>
    <div id="composerRow">
      <textarea id="input" placeholder="输入任务，例如：读取当前页面并总结"></textarea>
      <button class="primary" id="sendBtn">发送</button>
    </div>
  </div>
  <script type="module" src="panel.js"></script>
</body>
</html>
